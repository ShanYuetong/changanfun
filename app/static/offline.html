<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>当前离线 · 长安玩乐指南</title>
  <meta name="theme-color" content="#bf3b2c">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* 离线页是静态文件，无法读取数据库，因此只做最小必要的样式补充 */
    .offline-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 20px;
      text-align: center;
    }
    .offline-mark {
      display: inline-grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: linear-gradient(145deg, #bf3b2c, #8d2b21);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
    }
    .offline-title {
      font-size: 22px;
      font-weight: 700;
      color: #1b2a4a;
      margin: 0 0 10px;
    }
    .offline-text {
      color: #4a5878;
      line-height: 1.8;
      margin: 0 0 26px;
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <span class="offline-mark" aria-hidden="true">长</span>
    <h1 class="offline-title">当前处于离线状态</h1>
    <p class="offline-text">
      网络连接似乎断开了。<br>
      活动数据需要联网才能读取，请检查网络后刷新页面。
    </p>
    <a class="btn btn-primary" href="/">重新加载</a>
  </div>
</body>
</html>
