<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="{{ app_tagline }}。面向西安大学生的本地娱乐信息聚合网站。">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('home') }}" aria-label="{{ app_name }} 首页">
        <span class="brand-mark" aria-hidden="true">长</span>
        <span class="brand-text">
          <span class="brand-name">{{ app_name }}</span>
          <span class="brand-sub">{{ app_name_en }}</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/#events">活动列表</a>
        <a href="/docs">API 文档</a>
        <a href="/api/health">健康检查</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-notice">
        <span class="badge badge-demo">演示数据</span>
        {{ demo_notice }}
      </p>
      <p class="footer-meta">
        {{ app_name }} · v{{ app_version }} · 本站仅供学习与作品展示使用
      </p>
    </div>
  </footer>

  <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
</body>
</html>
